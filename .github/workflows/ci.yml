name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy

      - name: Run quality gates
        shell: pwsh
        run: tools/quality/quality_gate.ps1 -RequireClangTools

  security-scan:
    name: security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan
        shell: pwsh
        run: tools/security/secret_scan.ps1 -FailOnMissingGit
  backend-foundation:
    name: backend foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure backend tests
        run: cmake -S . -B build/ci-backend -DCMAKE_BUILD_TYPE=Debug -DINDUSPILOT_BUILD_CLIENT=OFF -DINDUSPILOT_BUILD_TESTS=ON

      - name: Build backend tests
        run: cmake --build build/ci-backend

      - name: Run backend tests
        run: ctest --test-dir build/ci-backend --output-on-failure

      - name: Upload foundation build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-foundation-evidence
          path: |
            build/ci-backend/backend/induspilot-backend-tests*
            build/ci-backend/Testing/Temporary/LastTest.log
            build/ci-backend/backend/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  backend-runtime-matrix:
    name: backend runtime (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: redis
            preset: dev-redis
          - name: http
            preset: dev-http

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure ${{ matrix.name }} runtime
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Build ${{ matrix.name }} runtime
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test ${{ matrix.name }} runtime
        shell: pwsh
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Upload ${{ matrix.name }} build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-runtime-${{ matrix.name }}-evidence
          path: |
            build/${{ matrix.preset }}/backend/induspilot-backend*
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/backend/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  backend-runtime-profile:
    name: real backend runtime profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure MongoDB HTTP runtime
        run: cmake --preset dev-http-mongodb

      - name: Build MongoDB HTTP runtime
        run: cmake --build --preset dev-http-mongodb --parallel

      - name: Create CI dependency env
        shell: bash
        run: |
          cp deployment/.env.example deployment/.env
          sed -i 's/change-me-root-password/ci-root-password/g' deployment/.env
          sed -i 's/change-me-app-password/ci-app-password/g' deployment/.env
          sed -i 's/change-me-redis-password/ci-redis-password/g' deployment/.env
          sed -i 's/change-me-mongodb-password/ci-mongodb-password/g' deployment/.env
          sed -i 's/^INDUSPILOT_MYSQL_DATABASE=.*/INDUSPILOT_MYSQL_DATABASE=induspilot_ci_custom_db/' deployment/.env

      - name: Run real dependency and HTTP profile smoke
        shell: pwsh
        env:
          INDUSPILOT_EXPECTED_MYSQL_DATABASE: induspilot_ci_custom_db
        run: >-
          ./backend/tests/http_runtime_profile_smoke.ps1
          -BackendExe build/dev-http-mongodb/backend/induspilot-backend
          -AiInteractionStore mongodb
          -StartDependencies
          -RunDependencySmoke
          -StopDependencies

      - name: Upload runtime profile build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-runtime-profile-evidence
          path: |
            build/dev-http-mongodb/backend/induspilot-backend
            build/dev-http-mongodb/Testing/Temporary/LastTest.log
            build/dev-http-mongodb/backend/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  configuration-preflight:
    name: configuration preflight
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment preflight
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File deployment/preflight.ps1

      - name: Validate CMake presets
        shell: powershell
        run: cmake --list-presets=configure

  dependency-services:
    name: dependency services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create dependency env
        shell: bash
        run: |
          cp deployment/.env.example deployment/.env
          sed -i 's/change-me-root-password/ci-root-password/g' deployment/.env
          sed -i 's/change-me-app-password/ci-app-password/g' deployment/.env
          sed -i 's/change-me-redis-password/ci-redis-password/g' deployment/.env
          sed -i 's/change-me-mongodb-password/ci-mongodb-password/g' deployment/.env
          sed -i 's/^INDUSPILOT_MYSQL_DATABASE=.*/INDUSPILOT_MYSQL_DATABASE=induspilot_ci_custom_db/' deployment/.env

      - name: Start dependencies
        shell: bash
        run: docker compose --env-file deployment/.env -f deployment/docker-compose.yml up -d --wait

      - name: Run dependency smoke
        shell: bash
        env:
          INDUSPILOT_EXPECTED_MYSQL_DATABASE: induspilot_ci_custom_db
        run: bash backend/tests/dependency_services_smoke.sh

      - name: Stop dependencies
        if: always()
        shell: bash
        run: docker compose --env-file deployment/.env -f deployment/docker-compose.yml down -v

  openspec:
    name: openspec validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.6.0

      - name: Validate specs
        run: openspec validate --specs --strict

      - name: Validate active changes
        run: openspec validate --changes --strict
