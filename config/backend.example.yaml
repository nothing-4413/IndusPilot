server:
  host: "0.0.0.0"
  port: 8080

log:
  level: "info"

mysql:
  host: "127.0.0.1"
  port: 3306
  database: "induspilot"
  user: "induspilot"
  password: "change-me"
  # uri 非空时 MySQL 仓储会优先使用 uri；为空时使用 host/port/database/user/password 组装连接。
  uri: ""

redis:
  host: "127.0.0.1"
  port: 6379
  # Redis 会话存储当前使用 uri 建立连接；如需口令或 DB，请写入 uri，例如 tcp://:password@127.0.0.1:6379/0。
  password: ""
  database: 0
  uri: "tcp://127.0.0.1:6379"
  session_key_prefix: "induspilot:session:"
  session_ttl_seconds: 28800
  session_store: "memory"

storage:
  # memory 用于本地演示；mysql 会将身份、资产、告警、工单、运行状态和 AI 审计切换到 MySQL 仓储。
  repository_store: "memory"

mongodb:
  # 当前仅参与 TCP 健康探测；非结构化日志、知识片段和 AI 上下文仍在后续模块中接入。
  uri: "mongodb://127.0.0.1:27017"
  database: "induspilot"

security:
  # 登录失败锁定用于抑制暴力尝试；超过阈值后登录接口返回 429 和 Retry-After。
  login_lockout_enabled: true
  login_rate_limit_store: "memory"
  # 仅供本地内存仓储演示；生产环境必须保持 false。
  allow_seed_credentials: true
  login_max_failures: 5
  login_failure_window_seconds: 60
  login_lockout_seconds: 900
  password_min_length: 12
  password_iterations: 120000

ai:
  # provider 支持 disabled/http；启用 Drogon 构建时 http 会向 endpoint 发起真实推理请求。
  enabled: false
  # 默认降级，不阻断核心服务；仅在生产明确要求 AI 时设为 true。
  required: false
  provider: "disabled"
  endpoint: "http://127.0.0.1:9000/v1/complete"
  # api_key 为空时不发送鉴权头；生产环境建议通过 INDUSPILOT_AI_API_KEY 注入。
  api_key: ""
  auth_header: "Authorization"
  auth_scheme: "Bearer"
  timeoutMs: 15000
  # 仅重试 transport、408、429 和 5xx；所有尝试共享 timeoutMs 总预算。
  max_retries: 0
  # Provider 响应超过该字节数时直接降级，避免处理无界响应。
  max_response_bytes: 1048576
  maxContextItems: 20
  storeInteractionRecords: true
  require_structured_response: true

notifications:
  # webhook 仅在显式开启后发送 HTTP(S) 请求；email 仍需独立邮件适配器。
  webhook_enabled: false
  webhook_timeout_ms: 5000
  webhook_allowed_hosts: ""

audit:
  # Limits routine audit searches only. Historical chain records remain available to integrity checks and protected archival.
  retention_days: 0
  siem_webhook_enabled: false
  siem_webhook_url: ""
  siem_webhook_timeout_ms: 5000
  siem_webhook_allowed_hosts: ""

readiness:
  # readiness 单次依赖探测超时和结果缓存时间，单位为毫秒。
  probe_timeout_ms: 1000
  probe_cache_ms: 1000

shutdown:
  # 优雅停机等待在途请求的最长时间；到期后记录剩余请求并退出 HTTP runtime。
  drain_timeout_ms: 10000
