server:
  host: "0.0.0.0"
  port: 8080

log:
  level: "info"

mysql:
  host: "127.0.0.1"
  port: 3306
  database: "induspilot"
  user: "induspilot"
  password: "change-me"
  # uri 非空时 MySQL 仓储会优先使用 uri；为空时使用 host/port/database/user/password 组装连接。
  uri: ""

redis:
  host: "127.0.0.1"
  port: 6379
  # Redis 会话存储当前使用 uri 建立连接；如需口令或 DB，请写入 uri，例如 tcp://:password@127.0.0.1:6379/0。
  password: ""
  database: 0
  uri: "tcp://127.0.0.1:6379"
  session_key_prefix: "induspilot:session:"
  session_ttl_seconds: 28800
  session_store: "memory"

storage:
  # memory 用于本地演示；mysql 会将身份、资产、告警、工单、运行状态和 AI 审计切换到 MySQL 仓储。
  repository_store: "memory"

mongodb:
  # 当前仅参与 TCP 健康探测；非结构化日志、知识片段和 AI 上下文仍在后续模块中接入。
  uri: "mongodb://127.0.0.1:27017"
  database: "induspilot"

security:
  # 登录失败锁定用于抑制暴力尝试；超过阈值后登录接口返回 429 和 Retry-After。
  login_lockout_enabled: true
  login_max_failures: 5
  login_failure_window_seconds: 60
  login_lockout_seconds: 900

ai:
  # provider 支持 disabled/http；启用 Drogon 构建时 http 会向 endpoint 发起真实推理请求。
  enabled: false
  provider: "disabled"
  endpoint: "http://127.0.0.1:9000/v1/complete"
  # api_key 为空时不发送鉴权头；生产环境建议通过 INDUSPILOT_AI_API_KEY 注入。
  api_key: ""
  auth_header: "Authorization"
  auth_scheme: "Bearer"
  timeoutMs: 15000
  maxContextItems: 20
  storeInteractionRecords: true
  require_structured_response: true
